# Ollama
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=qwen3:0.6b
# 打印请求和响应日志
langchain4j.ollama.chat-model.log-requests=${LANGCHAIN4J_LOG_REQUESTS:false}
langchain4j.ollama.chat-model.log-responses=${LANGCHAIN4J_LOG_RESPONSES:false}
#请求和响应日志
langchain4j.open-ai.chat-model.log-requests=${LANGCHAIN4J_LOG_REQUESTS:false}
langchain4j.open-ai.chat-model.log-responses=${LANGCHAIN4J_LOG_RESPONSES:false}
# 阿里云百炼 OpenAI 兼容接口
langchain4j.open-ai.chat-model.base-url=https://ws-hnqptj4bvbrn0vwb.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.open-ai.chat-model.model-name=qwen3.7-flash
# Wan 图片生成
# ==========================
aliyun.wan.base-url=https://ws-hnqptj4bvbrn0vwb.cn-beijing.maas.aliyuncs.com/api/v1
aliyun.wan.api-key=${DASHSCOPE_API_KEY:}
aliyun.wan.model=wan2.7-image
# DashScope 原生协议配置（QwenChatModel）
langchain4j.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.dashscope.chat-model.model-name=qwen-turbo
#MongoDB连接配置
spring.data.mongodb.uri=${XIAOZHI_MONGODB_URI:mongodb://localhost:27017/chat_memory_db}
#启用日志debug级别
logging.level.root=info
# 基本数据源配置
spring.datasource.url=${XIAOZHI_DATASOURCE_URL:jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${XIAOZHI_DB_USERNAME:root}
spring.datasource.password=${XIAOZHI_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 开启 SQL 日志打印
mybatis-plus.configuration.log-impl=${XIAOZHI_SQL_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

# 功能完善：AI 号源查询地址统一由环境变量覆盖，本地联调默认走 localhost。
yygh.service-hosp-url=${YYGH_SERVICE_HOSP_URL:http://localhost:8201}
# 功能完善：正式预约统一经过网关验证用户 JWT，禁止 AI 直连 inner 接口绕过资源归属校验。
yygh.gateway-url=${YYGH_GATEWAY_URL:http://localhost:8222}
