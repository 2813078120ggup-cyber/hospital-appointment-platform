server.port=8222
spring.application.name=service-gateway
spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:192.168.6.101:8848}
# 功能完善：Windows 多网卡环境显式注册 VMnet8 地址，其他环境可通过变量覆盖。
spring.cloud.nacos.discovery.ip=${YYGH_NACOS_DISCOVERY_IP:192.168.6.1}
spring.cloud.nacos.discovery.ip-type=IPv4
spring.cloud.gateway.discovery.locator.enabled=true

# 管理员登录/info 接口实际在 service-hosp，优先级最高
spring.cloud.gateway.routes[0].id=service-hosp-admin
spring.cloud.gateway.routes[0].uri=lb://service-hosp
spring.cloud.gateway.routes[0].predicates=Path=/user/hosp/**

spring.cloud.gateway.routes[1].id=service-hosp
spring.cloud.gateway.routes[1].uri=lb://service-hosp
spring.cloud.gateway.routes[1].predicates=Path=/*/hosp/**

spring.cloud.gateway.routes[2].id=service-cmn
spring.cloud.gateway.routes[2].uri=lb://service-cmn
spring.cloud.gateway.routes[2].predicates=Path=/*/cmn/**

spring.cloud.gateway.routes[3].id=service-user
spring.cloud.gateway.routes[3].uri=lb://service-user
spring.cloud.gateway.routes[3].predicates=Path=/*/user/**

spring.cloud.gateway.routes[4].id=service-msm
spring.cloud.gateway.routes[4].uri=lb://service-msm
spring.cloud.gateway.routes[4].predicates=Path=/*/msm/**

spring.cloud.gateway.routes[5].id=service-oss
spring.cloud.gateway.routes[5].uri=lb://service-oss
spring.cloud.gateway.routes[5].predicates=Path=/*/oss/**

spring.cloud.gateway.routes[6].id=service-orders
spring.cloud.gateway.routes[6].uri=lb://service-orders
spring.cloud.gateway.routes[6].predicates=Path=/*/order/**

spring.cloud.gateway.routes[7].id=service-sta
spring.cloud.gateway.routes[7].uri=lb://service-sta
spring.cloud.gateway.routes[7].predicates=Path=/*/statistics/**

# 功能完善：JWT 密钥必须由运行环境提供，且不少于 32 个 UTF-8 字节。
yygh.jwt.secret=${YYGH_JWT_SECRET:=local-dev-only-yygh-jwt-secret-2026-08-24}
# 本地演示账号：上线前将该开关设为 false，并移除前端 mock 登录。
yygh.mock-login.enabled=${YYGH_MOCK_LOGIN_ENABLED:true}
yygh.mock-login.token=${YYGH_MOCK_LOGIN_TOKEN:mock-token-1350000000}
yygh.mock-login.user-id=${YYGH_MOCK_LOGIN_USER_ID:26}
