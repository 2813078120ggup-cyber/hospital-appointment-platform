server.port=8160

spring.application.name=service-user
spring.profiles.active=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${YYGH_USER_DATASOURCE_URL:jdbc:mysql://192.168.6.101:3306/yygh_user?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
spring.datasource.username=${YYGH_DB_USERNAME:root}
spring.datasource.password=${YYGH_DB_PASSWORD:123456}

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:192.168.6.101:8848}

mybatis-plus.mapper-locations=classpath:com/atguigu/yygh/user/mapper/xml/*.xml

spring.data.redis.host=${YYGH_REDIS_HOST:192.168.6.101}
spring.data.redis.port=${YYGH_REDIS_PORT:6379}
spring.data.redis.database= 0
spring.data.redis.timeout=1800000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=-1

spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=0

wx.open.app_id=${WECHAT_OPEN_APP_ID:}
wx.open.app_secret=${WECHAT_OPEN_APP_SECRET:}
wx.open.redirect_url=${WECHAT_OPEN_REDIRECT_URL:http://localhost:8160/api/user/wx/callback}
