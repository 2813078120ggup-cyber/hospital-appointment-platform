server.port=8201
spring.application.name=service-hosp
spring.profiles.active=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${YYGH_HOSP_DATASOURCE_URL:jdbc:mysql://192.168.6.101:3306/yygh_hosp?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
spring.datasource.username=${YYGH_DB_USERNAME:root}
spring.datasource.password=${YYGH_DB_PASSWORD:123456}
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# logging.level.root=WARN

spring.data.mongodb.uri=${YYGH_MONGODB_URI:mongodb://192.168.6.101:27017/test}

spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:192.168.6.101:8848}
# 功能完善：Windows 多网卡环境显式注册 VMnet8 地址，其他环境可通过变量覆盖。
spring.cloud.nacos.discovery.ip=${YYGH_NACOS_DISCOVERY_IP:192.168.6.1}
spring.cloud.nacos.discovery.ip-type=IPv4

spring.rabbitmq.host=${YYGH_RABBITMQ_HOST:192.168.6.101}
spring.rabbitmq.port=${YYGH_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${YYGH_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${YYGH_RABBITMQ_PASSWORD:guest}

# 本地演示默认使用 admin/123456，生产环境必须通过环境变量覆盖密码。
yygh.admin.username=${YYGH_ADMIN_USERNAME:admin}
yygh.admin.password=${YYGH_ADMIN_PASSWORD:123456}

# 功能完善：签名密钥首次同步使用独立引导令牌，医院模拟系统默认运行在本机 9998。
yygh.hospital-manage.base-url=${YYGH_HOSPITAL_MANAGE_URL:http://localhost:9998}
yygh.hospital-manage.bootstrap-token=${YYGH_HOSPITAL_BOOTSTRAP_TOKEN:}

# 统一 JWT 密钥：与网关保持一致，支持环境变量覆盖
yygh.jwt.secret=${YYGH_JWT_SECRET:local-dev-only-yygh-jwt-secret-2026-08-24}
