server.port=8201
spring.application.name=service-hosp
spring.profiles.active=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${YYGH_HOSP_DATASOURCE_URL:jdbc:mysql://localhost:3306/yygh_hosp?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
spring.datasource.username=${YYGH_DB_USERNAME:root}
spring.datasource.password=${YYGH_DB_PASSWORD:}
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# logging.level.root=WARN

spring.data.mongodb.uri=${YYGH_MONGODB_URI:mongodb://localhost:27017/test}

spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:localhost:8848}

spring.rabbitmq.host=${YYGH_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${YYGH_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${YYGH_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${YYGH_RABBITMQ_PASSWORD:guest}

# 功能完善：管理端密码和 JWT 密钥只从运行环境提供，不再返回固定 token。
yygh.admin.username=${YYGH_ADMIN_USERNAME:admin}
yygh.admin.password=${YYGH_ADMIN_PASSWORD:}

# 功能完善：签名密钥首次同步使用独立引导令牌，医院模拟系统默认运行在本机 9998。
yygh.hospital-manage.base-url=${YYGH_HOSPITAL_MANAGE_URL:http://localhost:9998}
yygh.hospital-manage.bootstrap-token=${YYGH_HOSPITAL_BOOTSTRAP_TOKEN:}
