server.port=8201
spring.application.name=service-hosp
spring.profiles.active=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${YYGH_HOSP_DATASOURCE_URL:jdbc:mysql://192.168.6.101:3306/yygh_hosp?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
spring.datasource.username=${YYGH_DB_USERNAME:root}
spring.datasource.password=${YYGH_DB_PASSWORD:}
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# logging.level.root=WARN

spring.data.mongodb.uri=${YYGH_MONGODB_URI:mongodb://192.168.6.101:27017/test}

spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:192.168.6.101:8848}

spring.rabbitmq.host=${YYGH_RABBITMQ_HOST:192.168.6.101}
spring.rabbitmq.port=${YYGH_RABBITMQ_PORT:5672}
