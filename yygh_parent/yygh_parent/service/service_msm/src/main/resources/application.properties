
server.port=8204

spring.application.name=service-msm

spring.data.redis.host=${YYGH_REDIS_HOST:192.168.6.101}
spring.data.redis.port=${YYGH_REDIS_PORT:6379}
spring.data.redis.database= 0
spring.data.redis.timeout=1800000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=-1

spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=0


spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:192.168.6.101:8848}
# 功能完善：Windows 多网卡环境显式注册 VMnet8 地址，其他环境可通过变量覆盖。
spring.cloud.nacos.discovery.ip=${YYGH_NACOS_DISCOVERY_IP:192.168.6.1}
spring.cloud.nacos.discovery.ip-type=IPv4

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

mybatis-plus.mapper-locations=classpath:com/atguigu/cmsservice/mapper/xml/*.xml

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.rabbitmq.host=${YYGH_RABBITMQ_HOST:192.168.6.101}

# 功能完善：短信凭据仅从环境变量读取，缺失时明确失败，禁止伪造发送成功。
aliyun.sms.appcode=${ALIYUN_SMS_APPCODE:099a1b83be634353ae83a654639264f6}
aliyun.sms.host=${ALIYUN_SMS_HOST:https://dfsns.market.alicloudapi.com}
aliyun.sms.path=${ALIYUN_SMS_PATH:/data/send_sms}
aliyun.sms.template-id=${ALIYUN_SMS_TEMPLATE_ID:CST_ptdie100}
spring.rabbitmq.port=${YYGH_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${YYGH_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${YYGH_RABBITMQ_PASSWORD:guest}

# 统一 JWT 密钥：与网关保持一致，支持环境变量覆盖
yygh.jwt.secret=${YYGH_JWT_SECRET:local-dev-only-yygh-jwt-secret-2026-08-24}
