server.port=8207
spring.application.name=service-orders
spring.profiles.active=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${YYGH_ORDER_DATASOURCE_URL:jdbc:mysql://192.168.6.101:3306/yygh_order?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
spring.datasource.username=${YYGH_DB_USERNAME:root}
spring.datasource.password=${YYGH_DB_PASSWORD:}

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.data.mongodb.uri=${YYGH_MONGODB_URI:mongodb://192.168.6.101:27017/test}

spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:192.168.6.101:8848}

spring.rabbitmq.host=${YYGH_RABBITMQ_HOST:192.168.6.101}
spring.rabbitmq.port=${YYGH_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${YYGH_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${YYGH_RABBITMQ_PASSWORD:guest}

spring.data.redis.host=${YYGH_REDIS_HOST:192.168.6.101}
spring.data.redis.port=${YYGH_REDIS_PORT:6379}
spring.data.redis.database= 0
spring.data.redis.timeout=1800000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=-1

spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=0

weixin.pay.appid=${WECHAT_PAY_APP_ID:}
weixin.pay.partner=${WECHAT_PAY_PARTNER_ID:}
weixin.pay.partnerkey=${WECHAT_PAY_PARTNER_KEY:}
weixin.cert=${WECHAT_PAY_CERT_PATH:}

mybatis-plus.mapper-locations=classpath:com/atguigu/yygh/orders/mapper/xml/*.xml

spring.cloud.sentinel.transport.dashboard=${YYGH_SENTINEL_DASHBOARD:192.168.6.101:8058}
spring.cloud.sentinel.transport.port=8858
