server.port=8205
spring.application.name=service-oss
spring.profiles.active=dev


spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB


aliyun.oss.file.endpoint=${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
aliyun.oss.file.keyid=${ALIYUN_OSS_KEY_ID:}
aliyun.oss.file.keysecret=${ALIYUN_OSS_KEY_SECRET:}

aliyun.oss.file.bucketname=${ALIYUN_OSS_BUCKET_NAME:}

spring.cloud.nacos.discovery.server-addr=${YYGH_NACOS_SERVER_ADDR:192.168.6.101:8848}
# 功能完善：Windows 多网卡环境显式注册 VMnet8 地址，其他环境可通过变量覆盖。
spring.cloud.nacos.discovery.ip=${YYGH_NACOS_DISCOVERY_IP:192.168.6.1}
spring.cloud.nacos.discovery.ip-type=IPv4

# 统一 JWT 密钥：与网关保持一致，支持环境变量覆盖
yygh.jwt.secret=${YYGH_JWT_SECRET:local-dev-only-yygh-jwt-secret-2026-08-24}
