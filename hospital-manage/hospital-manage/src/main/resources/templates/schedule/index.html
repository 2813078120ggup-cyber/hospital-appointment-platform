<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body class="clinic-page">
<div class="clinic-header"><div><h1>排班与号源</h1><p class="clinic-subtitle">按医生、科室、日期和状态查看排班，并将停诊状态同步到预约平台。</p></div><a class="btn btn-clinic" href="/schedule/create"><i class="fa fa-plus"></i> 新增排班</a></div>
<form class="clinic-toolbar" method="get" action="/schedule/list"><div class="form-group"><label>科室编号</label><input class="form-control" name="depcode" th:value="${depcode}" placeholder="科室编号"/></div><div class="form-group"><label>医生姓名</label><input class="form-control" name="doctorName" th:value="${doctorName}" placeholder="医生姓名"/></div><div class="form-group"><label>工作日期</label><input type="date" class="form-control" name="workDate" th:value="${workDate}"/></div><div class="form-group"><label>排班状态</label><select class="form-control" name="status"><option value="">全部状态</option><option value="1" th:selected="${status == 1}">可预约</option><option value="0" th:selected="${status == 0}">停约</option><option value="-1" th:selected="${status == -1}">停诊</option></select></div><button class="btn btn-clinic" type="submit"><i class="fa fa-search"></i> 查询</button><a class="btn btn-outline-clinic" href="/schedule/list">重置</a></form>
<div class="clinic-card"><div class="ibox-content"><div class="table-responsive"><table class="table clinic-table"><thead><tr><th>排班编号</th><th>日期</th><th>科室</th><th>医生</th><th>时段</th><th>剩余/总号源</th><th>挂号费</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="item : ${list}"><td th:text="${item.hosScheduleId}">编号</td><td th:text="${item.workDate}">日期</td><td th:text="${item.depcode}">科室</td><td><strong th:text="${item.docname}">医生</strong><br><small th:text="${item.title ?: '-'}">职称</small></td><td th:text="${item.workTime == 0 ? '上午' : '下午'}">上午</td><td th:text="${item.availableNumber + ' / ' + item.reservedNumber}">0 / 0</td><td th:text="${item.amount ?: '-'}">-</td><td><span class="status-badge" th:classappend="${item.status == 1 ? ' status-ok' : (item.status == -1 ? ' status-stop' : ' status-warn')}" th:text="${item.status == 1 ? '可预约' : (item.status == -1 ? '停诊' : '停约')}">状态</span></td><td class="actions"><a class="btn btn-xs btn-outline-clinic" th:href="@{/schedule/edit/{id}(id=${item.hosScheduleId})}">编辑</a><button class="btn btn-xs btn-outline-clinic js-status" type="button" th:attr="data-id=${item.hosScheduleId},data-status=${item.status == 1 ? -1 : 1}" th:text="${item.status == -1 ? '恢复' : '停诊'}">停诊</button><button class="btn btn-xs btn-outline-clinic js-delete" type="button" th:attr="data-id=${item.hosScheduleId}">删除</button></td></tr><tr th:if="${#lists.isEmpty(list)}"><td colspan="9" class="clinic-empty"><i class="fa fa-calendar-o"></i>暂无匹配排班</td></tr></tbody></table></div></div></div>
<div class="text-center" th:if="${total > pageSize}"><ul class="pagination"><li th:each="p : ${#numbers.sequence(1, (total + pageSize - 1) / pageSize)}"><a th:href="@{/schedule/list(pageNum=${p},pageSize=${pageSize},depcode=${depcode},doctorName=${doctorName},workDate=${workDate},status=${status})}" th:text="${p}">1</a></li></ul></div>
<script>$(function(){function post(url,data){$.post(url,data).done(function(r){if(r.code===200)location.reload();else alert(r.message||'操作失败');}).fail(function(){alert('网络异常，请稍后重试');});}$('.js-delete').on('click',function(){if(confirm('删除后将同步移除平台排班，确认继续？'))post('/schedule/remove/'+encodeURIComponent($(this).data('id')),{});});$('.js-status').on('click',function(){var b=$(this),status=Number(b.data('status'));if(confirm(status===-1?'确认停诊该排班？':'确认恢复该排班？'))post('/schedule/status',{scheduleId:b.data('id'),status:status});});});</script></body></html>
