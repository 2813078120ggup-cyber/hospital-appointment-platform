<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body class="clinic-page"><div class="clinic-form"><div class="clinic-header"><div><h1 th:text="${schedule['hosScheduleId'] == null ? '新增排班' : '编辑排班'}">新增排班</h1><p class="clinic-subtitle">排班保存后同步到预约平台；剩余号源不能大于总号源。</p></div><a class="btn btn-outline-clinic" href="/schedule/list">返回列表</a></div>
<form class="clinic-card clinic-form" th:action="@{/schedule/save}" method="post"><div class="ibox-content"><div class="section-title">排班信息</div><div class="row"><div class="col-sm-6"><div class="form-group"><label class="control-label">院内排班编号 <span class="text-danger">*</span></label><input class="form-control" name="hosScheduleId" th:value="${schedule['hosScheduleId']}" required/></div></div><div class="col-sm-6"><div class="form-group"><label class="control-label">科室编号 <span class="text-danger">*</span></label><input class="form-control" name="depcode" th:value="${schedule['depcode']}" required/></div></div></div><div class="row"><div class="col-sm-6"><div class="form-group"><label class="control-label">医生姓名 <span class="text-danger">*</span></label><select class="form-control" name="docname" required><option value="">请选择医生</option><option th:each="doctor : ${doctors}" th:value="${doctor.docname}" th:text="${doctor.docname + (doctor.title == null ? '' : ' · ' + doctor.title)}" th:selected="${doctor.docname == schedule['docname']}">医生</option></select></div></div><div class="col-sm-6"><div class="form-group"><label class="control-label">职称</label><input class="form-control" name="title" th:value="${schedule['title']}" placeholder="如：副主任医师"/></div></div></div><div class="form-group"><label class="control-label">擅长技能</label><textarea class="form-control" name="skill" th:text="${schedule['skill']}" placeholder="填写医生擅长方向"></textarea></div><div class="row"><div class="col-sm-4"><div class="form-group"><label class="control-label">工作日期 <span class="text-danger">*</span></label><input type="date" class="form-control" name="workDate" th:value="${schedule['workDate']}" required/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">时段</label><select class="form-control" name="workTime"><option value="0" th:selected="${schedule['workTime'] == null || schedule['workTime'] == 0}">上午</option><option value="1" th:selected="${schedule['workTime'] == 1}">下午</option></select></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">状态</label><select class="form-control" name="status"><option value="1" th:selected="${schedule['status'] == null || schedule['status'] == 1}">可预约</option><option value="0" th:selected="${schedule['status'] == 0}">停约</option><option value="-1" th:selected="${schedule['status'] == -1}">停诊</option></select></div></div></div><div class="row"><div class="col-sm-4"><div class="form-group"><label class="control-label">总号源</label><input type="number" min="0" class="form-control" name="reservedNumber" th:value="${schedule['reservedNumber'] == null ? 0 : schedule['reservedNumber']}" required/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">剩余号源</label><input type="number" min="0" class="form-control" name="availableNumber" th:value="${schedule['availableNumber'] == null ? 0 : schedule['availableNumber']}" required/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">挂号费</label><input class="form-control" name="amount" th:value="${schedule['amount']}" placeholder="如：50"/></div></div></div><div class="form-actions"><button class="btn btn-clinic" type="submit">保存排班</button> <a class="btn btn-outline-clinic" href="/schedule/list">取消</a></div></div></form></div></body></html>
