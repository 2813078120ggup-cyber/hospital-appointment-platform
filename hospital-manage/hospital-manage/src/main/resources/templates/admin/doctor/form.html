<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head>
<body class="clinic-page"><div class="clinic-form"><div class="clinic-header"><div><h1 th:text="${doctor.id == null ? '新增医生' : '编辑医生'}">新增医生</h1><p class="clinic-subtitle">医生使用姓名登录医生端，账号名会自动同步为医生姓名。</p></div><a class="btn btn-outline-clinic" href="/admin/doctor/list">返回列表</a></div>
<form class="clinic-card clinic-form" method="post" action="/admin/doctor/save"><div class="ibox-content"><input type="hidden" name="id" th:value="${doctor.id}"/><div class="section-title">账号信息</div>
<div class="form-group"><label class="control-label">医生姓名 <span class="text-danger">*</span></label><input class="form-control" name="docname" th:value="${doctor.docname}" required/><p class="help-block">登录医生端时输入此姓名。</p></div>
<div class="row"><div class="col-sm-6"><div class="form-group"><label class="control-label">职称</label><input class="form-control" name="title" th:value="${doctor.title}" placeholder="如：主任医师"/></div></div><div class="col-sm-6"><div class="form-group"><label class="control-label">联系电话</label><input class="form-control" name="phone" th:value="${doctor.phone}" placeholder="用于院内联系"/></div></div></div>
<div class="form-group"><label class="control-label" th:text="${doctor.id == null ? '初始密码' : '重置密码（可选）'}">初始密码</label><input class="form-control" type="password" name="loginPassword" minlength="6" maxlength="30" autocomplete="new-password"/><p class="help-block">留空时使用系统默认密码；密码仅用于医生端登录。</p></div>
<div class="form-group"><label class="control-label">账号状态</label><select class="form-control" name="status"><option value="1" th:selected="${doctor.status == null || doctor.status == 1}">启用</option><option value="0" th:selected="${doctor.status == 0}">停用</option></select></div>
<div class="form-actions"><button class="btn btn-clinic" type="submit">保存医生</button> <a class="btn btn-outline-clinic" href="/admin/doctor/list">取消</a></div></div></form></div></body></html>
