<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body class="clinic-page">
<div class="clinic-header"><div><h1>预约记录</h1><p class="clinic-subtitle">查看医院侧已接收的预约、支付和取消状态，方便每日对账。</p></div></div>
<form class="clinic-toolbar" method="get" action="/admin/order/list"><div class="form-group"><label>平台订单号</label><input class="form-control" name="platformOrderNo" th:value="${platformOrderNo}" placeholder="输入订单号"/></div><div class="form-group"><label>订单状态</label><select class="form-control" name="orderStatus"><option value="">全部状态</option><option value="0" th:selected="${orderStatus == 0}">待支付</option><option value="1" th:selected="${orderStatus == 1}">已支付</option><option value="2" th:selected="${orderStatus == 2}">已取号</option><option value="-1" th:selected="${orderStatus == -1}">已取消</option></select></div><button class="btn btn-clinic" type="submit"><i class="fa fa-search"></i> 查询</button><a class="btn btn-outline-clinic" href="/admin/order/list">重置</a></form>
<div class="clinic-card"><div class="ibox-content"><div class="table-responsive" th:if="${list != null && !list.isEmpty()}"><table class="table clinic-table"><thead><tr><th>平台订单号</th><th>排班</th><th>就诊人</th><th>联系电话</th><th>挂号费</th><th>状态</th><th>创建时间</th><th>支付时间</th></tr></thead><tbody><tr th:each="item : ${list}"><td th:text="${item.platformOrderNo ?: '-'}">-</td><td><strong th:text="${item.param.schedule != null ? item.param.schedule.docname : '排班已归档'}">医生</strong><br><small th:text="${item.param.schedule != null ? item.param.schedule.workDate : ''}"></small></td><td><strong th:text="${item.param.patient != null ? item.param.patient.name : '历史患者'}">患者</strong><br><small th:text="${item.param.patient != null ? item.param.patient.certificatesNo : ('档案 #' + (item.patientId ?: '-'))}">证件号</small></td><td th:text="${item.param.patient != null ? item.param.patient.phone : '-'}">-</td><td th:text="${item.amount ?: '-'}">-</td><td><span class="status-badge" th:classappend="${item.orderStatus == 1 ? ' status-ok' : (item.orderStatus == -1 ? ' status-muted' : ' status-warn')}" th:text="${item.orderStatus == 0 ? '待支付' : (item.orderStatus == 1 ? '已支付' : (item.orderStatus == 2 ? '已取号' : (item.orderStatus == -1 ? '已取消' : '未知')))}">状态</span></td><td th:text="${#dates.format(item.createTime,'yyyy-MM-dd HH:mm')}">-</td><td th:text="${item.payTime == null ? '-' : #dates.format(item.payTime,'yyyy-MM-dd HH:mm')}">-</td></tr></tbody></table></div><div class="clinic-empty" th:if="${list == null || list.isEmpty()}"><i class="fa fa-calendar-check-o"></i>暂无预约记录</div></div></div>
<div th:if="${totalPages > 1}" class="text-center"><ul class="pagination"><li th:each="p : ${#numbers.sequence(1,totalPages)}" th:classappend="${p == pageNum ? 'active' : ''}"><a th:href="@{/admin/order/list(pageNum=${p},pageSize=${pageSize},platformOrderNo=${platformOrderNo},orderStatus=${orderStatus})}" th:text="${p}">1</a></li></ul></div>
</body></html>
