<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="common/meta :: meta"></head>
<body class="clinic-page"><div class="clinic-header"><div><h1>科室管理</h1><p class="clinic-subtitle">维护医院科室及大科室归属，保存后会同步到预约平台。</p></div><a class="btn btn-clinic" href="/department/create"><i class="fa fa-plus"></i> 新增科室</a></div>
<form class="clinic-toolbar" method="get" action="/department/list"><div class="form-group"><label>科室编号</label><input class="form-control" name="depcode" th:value="${depcode}" placeholder="输入编号精确查询"/></div><button class="btn btn-clinic" type="submit">查询</button><a class="btn btn-outline-clinic" href="/department/list">重置</a></form>
<div class="clinic-card"><div class="ibox-content"><div class="table-responsive"><table class="table clinic-table"><thead><tr><th>科室编号</th><th>科室名称</th><th>大科室</th><th>简介</th><th>操作</th></tr></thead><tbody><tr th:each="item : ${list}"><td th:text="${item.depcode}">编号</td><td><strong th:text="${item.depname}">科室</strong></td><td th:text="${(item.bigname ?: '-') + ' (' + (item.bigcode ?: '-') + ')'}">-</td><td th:text="${item.intro ?: '-'}">-</td><td class="actions"><a class="btn btn-xs btn-outline-clinic" th:href="@{/department/edit/{code}(code=${item.depcode})}">编辑</a><button class="btn btn-xs btn-outline-clinic js-delete" type="button" th:attr="data-code=${item.depcode}">删除</button></td></tr><tr th:if="${#lists.isEmpty(list)}"><td colspan="5" class="clinic-empty"><i class="fa fa-sitemap"></i>暂无科室</td></tr></tbody></table></div></div></div>
<div class="text-center" th:if="${total > pageSize}"><ul class="pagination"><li th:each="p : ${#numbers.sequence(1, (total + pageSize - 1) / pageSize)}"><a th:href="@{/department/list(pageNum=${p},pageSize=${pageSize},depcode=${depcode})}" th:text="${p}">1</a></li></ul></div>
<script>$(function(){$('.js-delete').on('click',function(){var code=$(this).data('code');if(!confirm('删除科室会同步删除平台科室，确认继续？'))return;$.post('/department/remove/'+encodeURIComponent(code)).done(function(r){if(r.code===200)location.reload();else alert(r.message||'删除失败');}).fail(function(){alert('网络异常，请稍后重试');});});});</script></body></html>
