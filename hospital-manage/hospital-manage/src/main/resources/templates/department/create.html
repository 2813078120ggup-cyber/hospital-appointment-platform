<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body class="clinic-page"><div class="clinic-form"><div class="clinic-header"><div><h1 th:text="${department['depcode'] == null ? '新增科室' : '编辑科室'}">新增科室</h1><p class="clinic-subtitle">科室编号用于同步平台排班，请保持医院系统内唯一。</p></div><a class="btn btn-outline-clinic" href="/department/list">返回列表</a></div>
<form class="clinic-card clinic-form" th:action="@{/department/save}" method="post"><div class="ibox-content"><div class="section-title">科室信息</div><div class="row"><div class="col-sm-6"><div class="form-group"><label class="control-label">科室编号 <span class="text-danger">*</span></label><input class="form-control" name="depcode" th:value="${department['depcode']}" required/></div></div><div class="col-sm-6"><div class="form-group"><label class="control-label">科室名称 <span class="text-danger">*</span></label><input class="form-control" name="depname" th:value="${department['depname']}" required/></div></div></div><div class="row"><div class="col-sm-6"><div class="form-group"><label class="control-label">大科室编号</label><input class="form-control" name="bigcode" th:value="${department['bigcode']}"/></div></div><div class="col-sm-6"><div class="form-group"><label class="control-label">大科室名称</label><input class="form-control" name="bigname" th:value="${department['bigname']}"/></div></div></div><div class="form-group"><label class="control-label">科室简介</label><textarea class="form-control" name="intro" th:text="${department['intro']}" placeholder="介绍科室诊疗范围和特色"></textarea></div><div class="form-actions"><button class="btn btn-clinic" type="submit">保存科室</button> <a class="btn btn-outline-clinic" href="/department/list">取消</a></div></div></form></div></body></html>
