<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body>
<div class="doctor-shell"><div th:replace="doctor/navigation :: navigation('profile')"></div><main class="doctor-main"><div class="clinic-header"><div><h1>个人资料</h1><p class="clinic-subtitle">医生姓名由管理员维护；您可以更新联系方式和登录密码。</p></div></div>
<div class="row"><div class="col-md-7"><div class="clinic-card"><div class="ibox-content"><div class="section-title">公开资料</div><form id="profile-form"><div class="form-group"><label class="control-label">医生姓名</label><input class="form-control" th:value="${doctor.docname}" disabled/></div><div class="form-group"><label class="control-label">职称</label><input class="form-control" name="title" th:value="${doctor.title}" placeholder="如：主任医师"/></div><div class="form-group"><label class="control-label">联系电话</label><input class="form-control" name="phone" th:value="${doctor.phone}"/></div><button class="btn btn-clinic" type="submit">保存资料</button></form></div></div></div><div class="col-md-5"><div class="clinic-card"><div class="ibox-content"><div class="section-title">修改密码</div><form id="password-form"><div class="form-group"><label class="control-label">当前密码</label><input class="form-control" type="password" name="currentPassword" autocomplete="current-password" required/></div><div class="form-group"><label class="control-label">新密码</label><input class="form-control" type="password" name="newPassword" minlength="6" maxlength="30" autocomplete="new-password" required/></div><div class="form-group"><label class="control-label">确认新密码</label><input class="form-control" type="password" name="confirmPassword" minlength="6" maxlength="30" autocomplete="new-password" required/></div><button class="btn btn-clinic" type="submit">更新密码</button></form></div></div></div></div>
</main></div><script>$(function(){function submitForm(form,url){$.post(url,$(form).serialize()).done(function(r){if(r.code===200){alert(r.message||'保存成功');window.location.reload();}else{alert(r.message||'操作失败');}}).fail(function(){alert('网络异常，请稍后重试');});}$('#profile-form').on('submit',function(e){e.preventDefault();submitForm(this,'/doctor/profile');});$('#password-form').on('submit',function(e){e.preventDefault();submitForm(this,'/doctor/password');});});</script></body></html>
