<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body>
<div class="doctor-shell"><div th:replace="doctor/navigation :: navigation('home')"></div><main class="doctor-main">
<div class="clinic-header"><div><h1>早上好，<span th:text="${doctor.docname}">医生</span></h1><p class="clinic-subtitle">这里汇总您的排班与患者预约情况。</p></div></div>
<div class="metric-grid"><div class="metric-card"><span class="label">我的排班</span><div class="value" th:text="${scheduleCount}">0</div><div class="hint">包含全部状态</div></div><div class="metric-card success"><span class="label">可预约排班</span><div class="value" th:text="${availableScheduleCount}">0</div><div class="hint">患者可继续预约</div></div><div class="metric-card warning"><span class="label">预约总数</span><div class="value" th:text="${orderCount}">0</div><div class="hint">关联我的排班</div></div><div class="metric-card danger"><span class="label">已支付预约</span><div class="value" th:text="${paidOrderCount}">0</div><div class="hint">请按院内流程接诊</div></div></div>
<div class="operations-bar"><span class="title"><i class="fa fa-stethoscope"></i> 今日可执行操作</span><a class="btn btn-sm btn-clinic" href="/doctor/schedule">查看我的排班</a><a class="btn btn-sm btn-outline-clinic" href="/doctor/order">查看预约队列</a><a class="btn btn-sm btn-outline-clinic" href="/doctor/profile">更新个人资料</a></div>
<div class="row"><div class="col-md-7"><div class="clinic-card"><div class="ibox-content"><div class="clinic-header"><div><h2>近期排班</h2><p class="clinic-subtitle">按日期倒序显示</p></div></div><div class="table-responsive" th:if="${recentSchedules != null && !recentSchedules.isEmpty()}"><table class="table clinic-table"><thead><tr><th>日期</th><th>科室</th><th>时段</th><th>剩余号源</th><th>状态</th></tr></thead><tbody><tr th:each="item : ${recentSchedules}"><td th:text="${item.workDate}">日期</td><td th:text="${item.depcode}">科室</td><td th:text="${item.workTime == 0 ? '上午' : '下午'}">上午</td><td th:text="${item.availableNumber + ' / ' + item.reservedNumber}">0 / 0</td><td><span class="status-badge" th:classappend="${item.status == 1 ? ' status-ok' : (item.status == -1 ? ' status-stop' : ' status-warn')}" th:text="${item.status == 1 ? '可预约' : (item.status == -1 ? '停诊' : '停约')}">状态</span></td></tr></tbody></table></div><div class="clinic-empty" th:if="${recentSchedules == null || recentSchedules.isEmpty()}"><i class="fa fa-calendar-o"></i>暂无排班</div></div></div></div><div class="col-md-5"><div class="clinic-card"><div class="ibox-content"><div class="clinic-header"><div><h2>最近预约</h2><p class="clinic-subtitle">只读查看，状态由平台支付和医院流程更新</p></div></div><div th:if="${recentOrders != null && !recentOrders.isEmpty()}"><div class="clinic-note" th:each="item : ${recentOrders}" style="margin-bottom:8px"><strong th:text="${item.platformOrderNo ?: '院内预约'}">预约</strong><span class="pull-right" th:text="${item.orderStatus == 1 ? '已支付' : (item.orderStatus == 2 ? '已取号' : (item.orderStatus == -1 ? '已取消' : '待支付'))}">状态</span><br><small th:text="${item.param.schedule != null ? item.param.schedule.workDate + ' · ' + item.param.schedule.depcode : '排班已归档'}">排班</small></div></div><div class="clinic-empty" th:if="${recentOrders == null || recentOrders.isEmpty()}"><i class="fa fa-inbox"></i>暂无预约</div></div></div></div></div>
</main></div></body></html>
