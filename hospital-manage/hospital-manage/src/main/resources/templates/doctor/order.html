<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body>
<div class="doctor-shell"><div th:replace="doctor/navigation :: navigation('order')"></div><main class="doctor-main"><div class="clinic-header"><div><h1>预约队列</h1><p class="clinic-subtitle">查看关联本人排班的预约记录。取号、退号等状态由预约平台和医院接口同步。</p></div></div>
<form class="clinic-toolbar" method="get" action="/doctor/order"><div class="form-group"><label>订单状态</label><select class="form-control" name="orderStatus"><option value="">全部状态</option><option value="0" th:selected="${orderStatus == 0}">待支付</option><option value="1" th:selected="${orderStatus == 1}">已支付</option><option value="2" th:selected="${orderStatus == 2}">已取号</option><option value="-1" th:selected="${orderStatus == -1}">已取消</option></select></div><button class="btn btn-clinic" type="submit">筛选</button><a class="btn btn-outline-clinic" href="/doctor/order">重置</a></form>
<div class="clinic-card"><div class="ibox-content"><div class="table-responsive"><table class="table clinic-table"><thead><tr><th>平台订单号</th><th>排班日期</th><th>科室</th><th>就诊人</th><th>联系电话</th><th>状态</th><th>创建时间</th></tr></thead><tbody><tr th:each="item : ${list}"><td th:text="${item.platformOrderNo ?: '-'}">-</td><td th:text="${item.param.schedule != null ? item.param.schedule.workDate : '-'}">-</td><td th:text="${item.param.schedule != null ? item.param.schedule.depcode : '-'}">-</td><td><strong th:text="${item.param.patient != null ? item.param.patient.name : '历史患者'}">患者</strong><br/><small th:text="${item.param.patient != null ? item.param.patient.certificatesNo : ('档案 #' + (item.patientId ?: '-'))}">证件号</small></td><td th:text="${item.param.patient != null ? item.param.patient.phone : '-'}">-</td><td><span class="status-badge" th:classappend="${item.orderStatus == 1 ? ' status-ok' : (item.orderStatus == -1 ? ' status-muted' : ' status-warn')}" th:text="${item.orderStatus == 0 ? '待支付' : (item.orderStatus == 1 ? '已支付' : (item.orderStatus == 2 ? '已取号' : (item.orderStatus == -1 ? '已取消' : '未知')))}">状态</span></td><td th:text="${item.createTime == null ? '-' : #dates.format(item.createTime,'yyyy-MM-dd HH:mm')}">-</td></tr><tr th:if="${#lists.isEmpty(list)}"><td colspan="7" class="clinic-empty"><i class="fa fa-inbox"></i>暂无预约记录</td></tr></tbody></table></div></div></div></main></div></body></html>
