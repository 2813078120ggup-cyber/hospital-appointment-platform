<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body class="clinic-page"><div class="clinic-form"><div class="clinic-header"><div><h1>医院基本信息</h1><p class="clinic-subtitle">维护医院展示资料及预约规则，保存后会同步到预约平台。</p></div><a class="btn btn-outline-clinic" href="/hospital/index">返回详情</a></div>
<form class="clinic-card clinic-form" action="/hospital/save" method="post"><div class="ibox-content"><div class="section-title">医院资料</div><div class="row"><div class="col-sm-8"><div class="form-group"><label class="control-label">医院名称 <span class="text-danger">*</span></label><input class="form-control" name="hosname" th:value="${hospital != null ? hospital.hosname : ''}" required/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">医院等级</label><input class="form-control" name="hostype" th:value="${hospital != null ? hospital.hostype : ''}" placeholder="如：三级甲等"/></div></div></div><div class="row"><div class="col-sm-4"><div class="form-group"><label class="control-label">省编码</label><input class="form-control" name="provinceCode" th:value="${hospital != null ? hospital.provinceCode : ''}"/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">市编码</label><input class="form-control" name="cityCode" th:value="${hospital != null ? hospital.cityCode : ''}"/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">区县编码</label><input class="form-control" name="districtCode" th:value="${hospital != null ? hospital.districtCode : ''}"/></div></div></div><div class="form-group"><label class="control-label">医院地址</label><input class="form-control" name="address" th:value="${hospital != null ? hospital.address : ''}"/></div><div class="form-group"><label class="control-label">就医路线</label><textarea class="form-control" name="route" th:text="${hospital != null ? hospital.route : ''}" placeholder="填写地铁、公交和院区入口提示"></textarea></div><div class="form-group"><label class="control-label">医院简介</label><textarea class="form-control" name="intro" th:text="${hospital != null ? hospital.intro : ''}" placeholder="面向患者展示的医院介绍"></textarea></div><div class="section-title">预约规则</div><div class="row"><div class="col-sm-4"><div class="form-group"><label class="control-label">预约周期（天）</label><input type="number" min="1" class="form-control" name="cycle" th:value="${hospital != null && hospital.bookingRule != null ? hospital.bookingRule.cycle : 7}"/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">放号时间</label><input class="form-control" name="releaseTime" th:value="${hospital != null && hospital.bookingRule != null ? hospital.bookingRule.releaseTime : ''}" placeholder="如：08:00"/></div></div><div class="col-sm-4"><div class="form-group"><label class="control-label">停挂时间</label><input class="form-control" name="stopTime" th:value="${hospital != null && hospital.bookingRule != null ? hospital.bookingRule.stopTime : ''}" placeholder="如：23:00"/></div></div></div><div class="row"><div class="col-sm-6"><div class="form-group"><label class="control-label">退号规则</label><select class="form-control" name="quitDay"><option value="-1" th:selected="${hospital == null || hospital.bookingRule == null || hospital.bookingRule.quitDay == -1}">就诊前一工作日</option><option value="0" th:selected="${hospital != null && hospital.bookingRule != null && hospital.bookingRule.quitDay == 0}">就诊当日</option></select></div></div><div class="col-sm-6"><div class="form-group"><label class="control-label">退号时间</label><input class="form-control" name="quitTime" th:value="${hospital != null && hospital.bookingRule != null ? hospital.bookingRule.quitTime : ''}" placeholder="如：15:00"/></div></div></div><div class="form-group"><label class="control-label">预约须知</label><textarea class="form-control" name="rule" th:text="${hospital != null && hospital.bookingRule != null && hospital.bookingRule.rule != null ? hospital.bookingRule.rule[0] : ''}" placeholder="每条须知单独一行"></textarea></div><div class="form-actions"><button class="btn btn-clinic" type="submit">保存医院资料</button> <a class="btn btn-outline-clinic" href="/hospital/index">取消</a></div></div></form></div></body></html>
