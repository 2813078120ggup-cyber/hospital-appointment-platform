<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:include="common/meta :: meta"></head><body class="clinic-page"><div class="clinic-header"><div><h1>医院基本信息</h1><p class="clinic-subtitle">预约平台展示的医院资料和规则。</p></div><a class="btn btn-clinic" href="/hospital/create"><i class="fa fa-pencil"></i> 维护医院资料</a></div>
<div class="row" th:if="${hospital != null}"><div class="col-md-8"><div class="clinic-card"><div class="ibox-content"><div class="clinic-header"><div><h2 th:text="${hospital.hosname}">医院名称</h2><p class="clinic-subtitle" th:text="${'医院编码：' + hospital.hoscode}">医院编码</p></div><span class="status-badge status-ok" th:text="${hospital.hostype}">医院等级</span></div><dl class="dl-horizontal"><dt>地址</dt><dd th:text="${hospital.address ?: '-'}">-</dd><dt>就医路线</dt><dd th:text="${hospital.route ?: '-'}">-</dd><dt>医院简介</dt><dd th:text="${hospital.intro ?: '-'}">-</dd></dl></div></div></div><div class="col-md-4"><div class="clinic-card"><div class="ibox-content"><h2>预约规则</h2><p class="clinic-subtitle">患者端展示的预约约束</p><dl><dt>预约周期</dt><dd th:text="${hospital.bookingRule != null ? hospital.bookingRule.cycle + ' 天' : '-'}">-</dd><dt>放号时间</dt><dd th:text="${hospital.bookingRule != null ? hospital.bookingRule.releaseTime : '-'}">-</dd><dt>停挂时间</dt><dd th:text="${hospital.bookingRule != null ? hospital.bookingRule.stopTime : '-'}">-</dd><dt>退号时间</dt><dd th:text="${hospital.bookingRule != null ? hospital.bookingRule.quitTime : '-'}">-</dd><dt>预约须知</dt><dd th:text="${hospital.bookingRule != null ? hospital.bookingRule.rule : '-'}">-</dd></dl></div></div></div></div><div class="clinic-empty" th:if="${hospital == null}"><i class="fa fa-hospital-o"></i>暂无医院资料，请先维护。</div></body></html>
