server:
  port: 9998
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
spring:
  thymeleaf:
    mode: LEGACYHTML5
    #编码 可不用配置
    encoding: UTF-8
    #开发配置为false,避免修改模板还要重启服务器
    cache: false
    #配置模板路径，默认是templates，可以不用配置
    prefix: classpath:/templates/
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.jdbc.Driver
    url: ${YYGH_MANAGE_DATASOURCE_URL:jdbc:mysql://192.168.6.101:3306/yygh_manage?characterEncoding=utf-8&useSSL=false}
    username: ${YYGH_DB_USERNAME:root}
    password: ${YYGH_DB_PASSWORD:123456}
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 12
      minimum-idle: 10
      pool-name: GuliHikariPool
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
logging:
  level:
    root: debug

# 功能完善：医院模拟系统默认连接指定平台服务器，仍可由环境变量覆盖。
yygh:
  platform-api:
    base-url: ${YYGH_PLATFORM_API_URL:http://192.168.6.101:8201}
  hospital-manage:
    bootstrap-token: ${YYGH_HOSPITAL_BOOTSTRAP_TOKEN:}
    doctor-default-password: ${YYGH_DOCTOR_DEFAULT_PASSWORD:123456}
